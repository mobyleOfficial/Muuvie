name: shelves_ui
description: Shelves UI shared by other modules (add a movie to shelves)
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  # 11.2 builds routes with material_ui, whose Theme this app does not provide:
  # pages then fall back to its default light theme and flash white in dark mode.
  auto_route: ">=11.1.0 <11.2.0"
  get_it: ^8.0.3
  common:
    path: ../common
  core:
    path: ../../core
  shelves:
    path: ../../features/shelves

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.13.1
