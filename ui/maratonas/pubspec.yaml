name: maratonas_ui
description: Maratonas (detail, challenges, ranking and editor) UI module for Muuvie
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  auto_route: ^11.1.0
  get_it: ^8.0.3
  intl: any
  cached_network_image: any
  url_launcher: ^6.3.1
  common:
    path: ../common
  core:
    path: ../../core
  maratonas:
    path: ../../features/maratonas
  social_network:
    path: ../../features/social_network
  social:
    path: ../social
  movies:
    path: ../../features/movies
  shelves:
    path: ../../features/shelves
  movies_ui:
    path: ../movies_ui
  profile_ui:
    path: ../profile
  public_profile:
    path: ../public_profile

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.13.1
