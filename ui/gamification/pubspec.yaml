name: gamification_ui
description: Vaquinhas, missions, Caderninho, watch parties and the poster game UI module for Muuvie (roadmap phase 10)
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  auto_route: ^11.1.0
  get_it: ^8.0.3
  intl: any
  cached_network_image: any
  common:
    path: ../common
  core:
    path: ../../core
  gamification:
    path: ../../features/gamification
  stats:
    path: ../../features/stats
  movies:
    path: ../../features/movies

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.13.1

flutter:
  assets:
    - assets/pets/
