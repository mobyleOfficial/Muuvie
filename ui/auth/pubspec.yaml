name: auth_ui
description: UI module for Auth feature - Login screen
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  auth:
    path: ../../features/auth
  auth_domain:
    path: ../../features/auth/domain
  common:
    path: ../common
  core:
    path: ../../core
  # 11.2 builds routes with material_ui, whose Theme this app does not provide:
  # pages then fall back to its default light theme and flash white in dark mode.
  auto_route: ">=11.1.0 <11.2.0"
  get_it: ^8.0.3

dev_dependencies:
  build_runner: ^2.13.1
  auto_route_generator: ^10.5.0
