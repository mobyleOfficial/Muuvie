name: cineclubes_ui
description: CineClubes (detail, progress, participants and editor) UI module for Muuvie
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  # 11.2 builds routes with material_ui, whose Theme this app does not provide:
  # pages then fall back to its default light theme and flash white in dark mode.
  auto_route: ">=11.1.0 <11.2.0"
  get_it: ^8.0.3
  intl: any
  cached_network_image: any
  url_launcher: ^6.3.1
  common:
    path: ../common
  core:
    path: ../../core
  cineclubes:
    path: ../../features/cineclubes
  maratonas_ui:
    path: ../maratonas
  movies:
    path: ../../features/movies
  movies_ui:
    path: ../movies_ui
  public_profile:
    path: ../public_profile

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.13.1
