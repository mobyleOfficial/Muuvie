name: movies_ui
description: Movies UI module for Muuvie
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  # 11.2 builds routes with material_ui, whose Theme this app does not provide:
  # pages then fall back to its default light theme and flash white in dark mode.
  auto_route: ">=11.1.0 <11.2.0"
  get_it: ^8.0.3
  cached_network_image: any
  collection: any
  infinite_scroll_pagination: ^5.0.0
  intl: any
  url_launcher: ^6.3.1
  common:
    path: ../common
  shelves:
    path: ../../features/shelves
  shelves_ui:
    path: ../shelves
  watch_logs_ui:
    path: ../watch_logs
  core:
    path: ../../core
  movies:
    path: ../../features/movies
  news:
    path: ../../features/news
  news_ui:
    path: ../news
  profile:
    path: ../../features/profile
  social_network:
    path: ../../features/social_network
  public_profile:
    path: ../public_profile

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.13.1
