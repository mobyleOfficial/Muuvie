name: news_ui
description: News UI module for Muuvie
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  # 11.2 builds routes with material_ui, whose Theme this app does not provide:
  # pages then fall back to its default light theme and flash white in dark mode.
  auto_route: ">=11.1.0 <11.2.0"
  get_it: ^8.0.3
  cached_network_image: any
  intl: any
  share_plus: ^11.0.0
  infinite_scroll_pagination: ^5.0.0
  common:
    path: ../common
  core:
    path: ../../core
  news:
    path: ../../features/news
  news_domain:
    path: ../../features/news/domain
  movies_ui:
    path: ../movies_ui
  shelves:
    path: ../../features/shelves
  shelves_ui:
    path: ../shelves

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.13.1
