  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  rxdart: ^0.28.0
  intl: ^0.20.2
  objectbox: ^5.3.1
  objectbox_flutter_libs: ^5.3.1
  path_provider: ^2.1.5
  dio: ^5.0.0
  webview_flutter: ^4.10.0
  core:
    path: core
  movies:
    path: features/movies
  movies_domain:
    path: features/movies/domain
  movies_data:
    path: features/movies/data
  shelves:
    path: features/shelves
  imports:
    path: features/imports
  watch_logs:
    path: features/watch_logs
  news:
    path: features/news
  news_domain:
    path: features/news/domain
  news_data:
    path: features/news/data
  profile:
    path: features/profile
  profile_domain:
    path: features/profile/domain
  profile_data:
    path: features/profile/data
  auth:
    path: features/auth
  auth_domain:
    path: features/auth/domain
  auth_data:
    path: features/auth/data
  social_network:
    path: features/social_network
  maratonas:
    path: features/maratonas
  cineclubes:
    path: features/cineclubes
  onboarding:
    path: features/onboarding
  onboarding_ui:
    path: ui/onboarding
  gamification:
    path: features/gamification
  gamification_ui:
    path: ui/gamification
  stats:
    path: features/stats
  cineclubes_ui:
    path: ui/cineclubes
  maratonas_ui:
    path: ui/maratonas
  movies_ui:
    path: ui/movies_ui
  programacao:
    path: ui/programacao
  shelves_ui:
    path: ui/shelves
  locadoras_ui:
    path: ui/locadoras
  imports_ui:
    path: ui/imports
  watch_logs_ui:
    path: ui/watch_logs
  news_ui:
    path: ui/news
  common:
    path: ui/common
  profile_ui:
    path: ui/profile
  search:
    path: ui/search
  social:
    path: ui/social
  whispers:
    path: ui/whispers
  auth_ui:
    path: ui/auth

  public_profile:
    path: ui/public_profile
  auto_route: ^11.1.0
  get_it: ^8.0.3
  injectable: ^2.5.0
  infinite_scroll_pagination: ^5.0.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  objectbox_generator: ^5.3.1
  auto_route_generator: ^10.5.0
  injectable_generator: ^2.7.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
