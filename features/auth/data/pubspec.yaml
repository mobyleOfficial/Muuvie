name: auth_data
description: Data layer for the Auth feature
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  auth_domain:
    path: ../domain
  injectable: any
  core:
    path: ../../../core
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  crypto: ^3.0.6

dev_dependencies:
  build_runner: ^2.13.1
